db.url=jdbc:postgresql://localhost:5432/fishing_shop
db.user=admin
db.password=secretpassword

connection.success=Connected to PostgreSQL!
connection.error=Failed to connect to PostgreSQL: %s

procedure.add_customer=CALL add_customer(?, ?, ?, ?)
procedure.update_customer=CALL update_customer(?, ?, ?, ?, ?)
procedure.delete_customer=CALL delete_customer(?)

procedure.add_product=CALL add_product(?, ?, ?, ?, ?)
procedure.update_product=CALL update_product(?, ?, ?, ?, ?, ?)

query.currval.order=SELECT currval('orders_order_id_seq')

procedure.create_order=CALL create_order(?, ?, ?, ?, ?, ?)
procedure.add_order_item=CALL add_order_item(?, ?, ?)
procedure.remove_order_item=CALL remove_order_item(?, ?)
procedure.update_order_status=CALL update_order_status(?, ?)
procedure.cancel_order=CALL cancel_order(?)
procedure.apply_discount=CALL apply_discount_to_order(?, ?)

procedure.add_loyalty_card=CALL add_loyalty_card(?, ?, ?, ?, ?)
procedure.update_loyalty_card=CALL update_loyalty_card(?, ?)
procedure.delete_loyalty_card=CALL delete_loyalty_card(?)
procedure.apply_bonus_points=CALL apply_bonus_points(?, ?)
procedure.update_card_level=CALL update_card_level_by_spending(?)

procedure.add_supplier=CALL add_supplier(?, ?, ?, ?)
procedure.update_supplier=CALL update_supplier(?, ?, ?, ?, ?)
procedure.delete_supplier=CALL delete_supplier(?)

procedure.add_category=CALL add_category(?, ?)
procedure.update_category=CALL update_category(?, ?, ?)
procedure.delete_category=CALL delete_category(?)

procedure.add_seller=CALL add_seller(?, ?, ?)
procedure.update_seller=CALL update_seller(?, ?, ?, ?)

procedure.add_card_level=CALL add_card_level(?, ?, ?)
procedure.update_card_level=CALL update_card_level(?, ?, ?, ?)
procedure.delete_card_level=CALL delete_card_level(?)

procedure.receive_supply=CALL receive_supply(?, ?, ?, ?, ?, ?)
procedure.update_supply_price=CALL update_supply_price(?, ?)
procedure.remove_supply=CALL remove_supply(?)

query.select.all.suppliers=SELECT * FROM suppliers ORDER BY company_name
query.select.all.categories=SELECT * FROM productcategories ORDER BY category_name
query.select.all.sellers=SELECT * FROM sellers ORDER BY full_name
query.select.all.card_levels=SELECT * FROM cardlevels ORDER BY level_id
query.select.all.product_supplies=SELECT * FROM productsupplies ORDER BY last_supply_date DESC

query.sales.report=SELECT * FROM get_sales_report(?, ?)
query.supplier.efficiency=SELECT * FROM get_supplier_efficiency(?, ?)
query.customer.bonus=SELECT * FROM get_customer_bonus_summary(?)

query.select.all.customers=SELECT * FROM customers ORDER BY customer_id
query.select.all.products=SELECT * FROM products ORDER BY product_name
query.select.all.loyalty_cards=SELECT * FROM loyaltycards ORDER BY loyalty_card_id
query.select.all.orders=SELECT * FROM orders ORDER BY order_id DESC
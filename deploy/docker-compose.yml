version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: fishing-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: fishing_shop
    volumes:
      - ./init_scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - fishing-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: fishing-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fishing.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - fishing-network
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:

networks:
  fishing-network: